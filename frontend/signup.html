<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Mini Health</title>
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/forms.css">
</head>

<body>

  <!-- 🌐 NAVBAR -->
  <nav class="navbar">
    <div class="logo">💚 Mini Health</div>
    <button id="themeToggle" class="toggle-theme" type="button">🌙</button>
  </nav>

  <!-- 🔐 SIGNUP SECTION -->
  <section class="auth-container">
    <div class="auth-card">

      <h2>Create Account 🩺</h2>
      <p class="subtitle">Join Mini Health as a patient or doctor</p>

      <!-- Signup Form -->
      <form id="signupForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" placeholder="Enter your phone number" required>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" required>

        <label for="role">Role</label>
        <select id="role" required>
          <option value="">Select Role</option>
          <option value="Patient">patient</option>
          <option value="Doctor">doctor</option>
        </select>

        <button type="submit" class="btn-primary">Sign Up</button>
      </form>

      <!-- Feedback Message -->
      <p id="msg" class="form-msg"></p>

      <!-- Proceed Button (after successful signup) -->
      <button id="proceedBtn" class="btn primary" style="display:none;" 
              onclick="window.location.href='login.html'">
        Proceed →
      </button>

      <!-- Switch to Login -->
      <p class="switch-text">
        Already have an account? <a href="login.html">Login</a>
      </p>

    </div>
  </section>

  <!-- Scripts -->
  <script src="scripts/auth.js"></script>
  <script src="scripts/main.js"></script>
  <script src="scripts/signup.js"></script>

</body>
</html>
