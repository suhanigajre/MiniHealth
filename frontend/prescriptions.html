<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Prescriptions | Mini Health</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f4f6f9;
    }

    .navbar {
      background: #007bff;
      padding: 15px 30px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar button {
      background: white;
      color: #007bff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
      padding: 30px;
    }

    /* LEFT PANEL */
    .patients-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      height: 500px;
      overflow-y: auto;
    }

    .patients-card h3 {
      margin-bottom: 15px;
      color: #007bff;
    }

    .patient-item {
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: 0.2s;
    }

    .patient-item:hover {
      background: #e9f2ff;
    }

    .patient-item.active {
      background: #007bff;
      color: white;
    }

    /* RIGHT PANEL */
    .prescription-section {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .prescription-history {
      max-height: 220px;
      overflow-y: auto;
      margin-bottom: 20px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }

    .history-card {
      background: #f9f9f9;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    input, textarea {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 10px;
    }

    textarea {
      height: 80px;
      resize: none;
    }

    .medicine-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn {
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      margin-right: 5px;
    }

    .btn-save { background: #28a745; color: white; }
    .btn-add { background: #007bff; color: white; }
    .btn-print { background: #6c757d; color: white; }

    @media(max-width: 768px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      button {
        display: none;
      }
    }

  </style>
</head>

<body>

<div class="navbar">
  <h2>Prescriptions 💊</h2>
  <a href="dashboard/doctor.html">Dashboard</a>
  <button id="logoutBtn">Logout</button>
</div>

<div class="dashboard">

  <!-- LEFT -->
  <div class="patients-card">
    <h3>Assigned Patients</h3>
    <div id="patientsList">Loading...</div>
  </div>

  <!-- RIGHT -->
  <div class="prescription-section" id="prescriptionArea">

    <h3 id="selectedPatientTitle">Select a Patient</h3>

    <div class="prescription-history" id="historyContainer"></div>

    <h4>Write Prescription</h4>

    <label>Diagnosis</label>
    <input type="text" id="diagnosis">

    <h4>Medicines</h4>
    <div id="medicineList"></div>

    <button class="btn btn-add" id="addMedicineBtn">+ Add Medicine</button>

    <label>Additional Notes</label>
    <textarea id="additionalNotes"></textarea>

    <div style="margin-top:15px;">
      <button class="btn btn-save" id="savePrescription">Save</button>
      <button class="btn btn-print" id="printPrescription">Print</button>
      <button class="btn btn-print" id="downloadPdf">Download PDF</button>
    </div>

  </div>

</div>

<script src="./scripts/prescriptions.js"></script>
</body>
</html>
