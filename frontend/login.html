<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Mini Health</title>

  <!-- Styles -->
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/forms.css">
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="index.html" class="logo">💚 Mini Health</a>
    <button id="themeToggle" class="toggle-theme" type="button">🌙</button>
  </nav>

  <!-- Login Form -->
  <section class="auth-container">
    <div class="auth-card">

      <h2>Welcome Back 👋</h2>
      <p class="subtitle">Login to your Mini Health account</p>

      <form id="loginForm">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <!-- Message -->
      <p id="msg" class="form-msg"></p>

      <!-- Switch -->
      <p class="switch-text">
        Don’t have an account? <a href="signup.html">Sign up</a>
      </p>

    </div>
  </section>

  <!-- Scripts -->
  <script src="scripts/login.js"></script>
  <script src="scripts/main.js"></script>
  <script src="scripts/theme.js"></script>

</body>
</html>
